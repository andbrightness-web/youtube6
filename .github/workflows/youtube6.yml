name: Build youtube6

# Fork build: every push to main builds the rootful .deb (iOS 12 iPod) and keeps
# it as a workflow artifact. No releases, no AltStore source, no update feed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS arm64 hosted runners are capacity-starved (job not acquired, 20.10.2026).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show Xcode
        run: xcodebuild -version

      - name: Pin SwiftLint 0.63.3
        run: |
          curl -sL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.63.3/portable_swiftlint.zip
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          sudo install -m 755 "$RUNNER_TEMP/swiftlint/swiftlint" "$(brew --prefix)/bin/swiftlint"

      - name: Install ldid-procursus
        run: |
          brew unlink ldid 2>/dev/null || true
          brew install ldid-procursus

      - name: Configure local build settings
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          # No update feed: an empty URL disables the in-app update poller.
          sed -i '' 's/^APP_MANIFEST_URL.*/APP_MANIFEST_URL =/' Config/Local.xcconfig

      - name: Fetch YouTube 2.0.0 artwork (not stored in the repo)
        run: ./scripts/yt6-fetch-donor.sh

      - name: Build IPA
        env:
          IPA_VERSION: "1.12.0"
          BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_SOURCE: "0"
          RELEASE_BUNDLE_ID: local.ipodos.youtube6
          XCODEBUILD_EXTRA_ARGS: >-
            CODE_SIGNING_ALLOWED=NO
            INFOPLIST_KEY_CFBundleDisplayName=YouTube
            ASSETCATALOG_COMPILER_APPICON_NAME=YT6AppIcon
        run: ./make_ipa.sh

      - name: Build deb
        env:
          PACKAGE_ID: local.ipodos.youtube6
          INSTALL_NAME: YouTube6
          DEB_VERSION: "1.12.0-${{ github.run_number }}"
        run: ./make_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: youtube6-${{ github.run_number }}
          path: YouTube6_*_iphoneos-arm.deb
          retention-days: 30
